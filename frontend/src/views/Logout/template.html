<div class="login-wrapper">
    <section class="login-shell" aria-label="VCL ログアウト">
        <div class="login-visual" aria-hidden="true">
            <div class="visual-topline">
                <span>VCL ACCESS TERMINAL</span>
                <span>LAB-07</span>
            </div>

            <div class="visual-content">
                <p class="visual-kicker">Session Termination</p>
                <h1 class="visual-title">実験室から<br>退室する</h1>
                <p class="visual-description">ログアウトすると、進行中のセッションが終了します。次回ログイン時に進捗とトロフィーが復元されます。</p>
            </div>

            <div class="molecule-board">
                <span class="molecule-node node-a"></span>
                <span class="molecule-node node-b"></span>
                <span class="molecule-node node-c"></span>
                <span class="molecule-node node-d"></span>
                <span class="molecule-link link-ab"></span>
                <span class="molecule-link link-bc"></span>
                <span class="molecule-link link-cd"></span>
            </div>

            <div class="visual-readouts">
                <div>
                    <span class="readout-label">ROOM</span>
                    <strong>ACTIVE</strong>
                </div>
                <div>
                    <span class="readout-label">SESSION</span>
                    <strong>OPEN</strong>
                </div>
                <div>
                    <span class="readout-label">MODE</span>
                    <strong>EXIT</strong>
                </div>
            </div>
        </div>

        <div class="login-form-section">
            <div class="login-card-modern">
                <div class="form-header">
                    <p class="form-kicker">Account Session</p>
                    <h2>ログアウト</h2>
                    <p>現在のセッションを終了しますか？</p>
                </div>

                <div class="logout-user-badge" id="logout-user-badge">
                    <span class="logout-user-icon">🧪</span>
                    <div class="logout-user-info">
                        <span class="logout-user-name" id="logout-user-name">---</span>
                        <span class="logout-user-role" id="logout-user-role">---</span>
                    </div>
                </div>

                <div class="logout-actions">
                    <button type="button" class="primary-btn logout-btn" id="btn-logout-confirm">
                        ログアウトする
                    </button>
                    <button type="button" class="secondary-btn logout-cancel-btn" id="btn-logout-cancel">
                        キャンセル
                    </button>
                </div>
            </div>
        </div>
    </section>
</div>
